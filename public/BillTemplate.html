<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banki Dairy Farm · July 2026 Bills</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Mulish:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ─── BRAND PALETTE (placeholders – swap when you share brand assets) ─── */
:root {
  --brand-dark:    #2D3142;   /* Brand charcoal (tagline/text) */
  --brand-mid:     #3E8FCC;   /* Brand blue                   */
  --brand-accent:  #3E8FCC;   /* Brand blue (accent)          */
  --brand-gold:    #2D7AB5;   /* Deeper blue for totals       */
  --brand-cream:   #F4F9FD;   /* Light blue-white paper       */
  --brand-warm:    #E8F3FB;   /* Soft blue tint               */
  --brand-rule:    #B8D8EE;   /* Soft blue rule               */
  --brand-text:    #2D3142;   /* Brand charcoal               */
  --brand-muted:   #5A7A9A;   /* Muted blue-grey              */
  --buffalo-chip:  #7B3F00;   /* Buffalo badge                */
  --cow-chip:      #2D7AB5;   /* Cow badge (brand blue)       */
}

/* ─── RESET ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Mulish', sans-serif;
  background: #D6E8F5;
  color: var(--brand-text);
  font-size: 13px;
  line-height: 1.5;
}

/* ─── SCREEN CONTROLS ─── */
.screen-only {
  padding: 20px;
}
.page-header {
  background: var(--brand-dark);
  border-radius: 14px;
  padding: 24px 28px;
  color: white;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.ph-logo {
  width: 64px; height: 64px;
  background: var(--brand-accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  flex-shrink: 0;
  /* ── REPLACE with: background: url('your-logo.png') center/cover ── */
}
.ph-title { flex: 1; }
.ph-title h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 1.75rem;
  color: #7DD3FA;
  letter-spacing: .01em;
}
.ph-title p { color: #8DC4E8; font-size: .82rem; margin-top: 2px; }
.ph-stats {
  display: flex; gap: 20px; flex-wrap: wrap;
}
.ph-stat { text-align: center; }
.ph-stat strong { display: block; font-size: 1.3rem; font-family: 'Instrument Serif', serif; color: #7DD3FA; }
.ph-stat span { font-size: .72rem; color: #8DC4E8; }

/* toolbar */
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-bottom: 16px; align-items: center;
}
.btn {
  padding: 9px 18px; border: none; border-radius: 7px;
  cursor: pointer; font-family: 'Mulish', sans-serif;
  font-size: .82rem; font-weight: 600; transition: .15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--brand-dark); color: white; }
.btn-primary:hover { background: var(--brand-mid); }
.btn-secondary { background: white; color: var(--brand-text); border: 1.5px solid var(--brand-rule); }
.btn-secondary:hover { background: var(--brand-cream); }
.btn-danger { background: #B91C1C; color: white; }
.btn-danger:hover { background: #991B1B; }
.search { padding: 9px 14px; border: 1.5px solid var(--brand-rule); border-radius: 7px; font-family: 'Mulish',sans-serif; font-size:.82rem; outline:none; width:220px; }
.search:focus { border-color: var(--brand-accent); }

/* grid */
.bills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

/* ─── THE BILL CARD ─── */
.bill-card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 10px rgba(26,58,26,.12);
  border: 1px solid var(--brand-rule);
  position: relative;
}
.bill-card.editing { box-shadow: 0 0 0 2.5px var(--brand-accent), 0 4px 20px rgba(125,181,67,.25); }

/* header strip */
.bc-header {
  background: var(--brand-dark);
  padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.bc-brand {
  display: flex; align-items: center; gap: 8px;
}
.bc-brand-logo {
  width: 30px; height: 30px;
  background: var(--brand-accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem;
  flex-shrink: 0;
  /* REPLACE: background: url('your-logo.png') center/cover no-repeat */
}
.bc-brand-name {
  font-family: 'Instrument Serif', serif;
  color: #7DD3FA;
  font-size: 1.1rem;
  line-height: 1.2;
}
.bc-brand-sub { color: #8DC4E8; font-size: .72rem; font-weight: 400; }
.bc-meta { text-align: right; }
.bc-meta-month { color: #8DC4E8; font-size: .6rem; text-transform: uppercase; letter-spacing: .07em; }
.bc-meta-no { color: #7DD3FA; font-size: .72rem; font-family: 'DM Mono', monospace; }

/* customer row */
.bc-customer {
  padding: 8px 14px 6px;
  border-bottom: 1px dashed var(--brand-rule);
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.bc-to { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: var(--brand-muted); display: block; }
.bc-name {
  font-size: .95rem; font-weight: 700; color: var(--brand-dark);
  font-family: 'Instrument Serif', serif;
}
.bc-name[contenteditable="true"] {
  outline: none;
  border-bottom: 1.5px solid var(--brand-accent);
  cursor: text;
  min-width: 80px;
}
.badge {
  font-size: .58rem; padding: 2px 7px; border-radius: 20px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  flex-shrink: 0;
}
.b-badge { background: #FCECD8; color: var(--buffalo-chip); border: 1px solid #D4A96A; }
.c-badge { background: #E0F0DA; color: var(--cow-chip); border: 1px solid #7DB543; }

/* delivery table */
.bc-table { width: 100%; border-collapse: collapse; }
.bc-table thead tr { background: var(--brand-warm); }
.bc-table th {
  padding: 5px 10px; text-align: left;
  font-size: .6rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--brand-muted); font-weight: 700;
}
.bc-table th:not(:first-child) { text-align: right; }
.bc-table td {
  padding: 4px 10px; border-bottom: 1px solid #EFF3EB;
  font-size: .73rem; color: var(--brand-text);
}
.bc-table td:not(:first-child) { text-align: right; font-family: 'DM Mono', monospace; }
.bc-table td[contenteditable="true"] {
  outline: none;
  background: #FEFFF8;
  border-bottom: 1px solid var(--brand-accent);
  cursor: text;
}
.bc-table tbody tr:hover { background: #F0F8FF; }
.bc-table tbody tr:last-child td { border-bottom: none; }

/* add-row button (edit mode) */
.add-row-btn {
  display: none;
  width: 100%; padding: 4px;
  background: #E8F3FB; border: none;
  color: var(--brand-mid); font-size: .72rem; font-weight: 600;
  cursor: pointer; font-family: 'Mulish', sans-serif;
}
.add-row-btn:hover { background: #D6E8F5; }
.editing .add-row-btn { display: block; }

/* footer */
.bc-footer {
  padding: 8px 14px 10px;
  background: var(--brand-cream);
  border-top: 1.5px solid var(--brand-rule);
}
.bc-summary-row {
  display: flex; justify-content: space-between;
  font-size: .72rem; color: var(--brand-muted);
  padding: 2px 0;
}
.bc-summary-row span:last-child { font-family: 'DM Mono', monospace; }
.bc-total-row {
  display: flex; justify-content: space-between; align-items: baseline;
  border-top: 1.5px solid var(--brand-rule);
  margin-top: 6px; padding-top: 6px;
  font-weight: 700; color: var(--brand-dark); font-size: .85rem;
}
.bc-total-amt {
  font-family: 'Instrument Serif', serif;
  font-size: 1.05rem; color: var(--brand-gold);
}
.bc-total-amt[contenteditable="true"] {
  outline: none; border-bottom: 1.5px solid var(--brand-gold); cursor: text;
}

/* QR section */
.bc-qr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 14px 0;
  border-top: 1px dashed var(--brand-rule);
  margin-top: 6px;
  gap: 10px;
}
.bc-qr-img {
  width: 88px; height: 88px;
  border: 1.5px dashed #C8D8B8;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: .55rem; color: var(--brand-muted); text-align: center;
  background: #EAF4FB; flex-shrink: 0;
  overflow: hidden;
  /* REPLACE: <img id="qr-placeholder"> or set background-image */
}
.bc-qr-img img { width: 100%; height: 100%; object-fit: cover; }
.bc-qr-text { flex: 1; }
.bc-qr-text p { font-size: .62rem; color: var(--brand-muted); line-height: 1.4; }
.bc-qr-text strong { color: var(--brand-dark); font-size: .68rem; display: block; }

/* payment note */
.bc-pay-note {
  font-size: .6rem; color: var(--brand-muted);
  text-align: center; margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--brand-rule);
  letter-spacing: .02em;
}

/* edit overlay controls */
.bc-edit-bar {
  display: none;
  justify-content: flex-end; gap: 6px;
  padding: 6px 10px;
  background: #E8F3FB;
  border-top: 1px solid var(--brand-rule);
}
.editing .bc-edit-bar { display: flex; }
.bc-edit-bar button {
  padding: 4px 10px; border: none; border-radius: 5px;
  font-size: .68rem; font-weight: 700; cursor: pointer;
  font-family: 'Mulish', sans-serif;
}
.btn-save { background: var(--brand-dark); color: white; }
.btn-cancel { background: #E5E7EB; color: #374151; }

/* ─── PRINT LAYOUT ─── */
@page { size: A4 portrait; margin: 0; }

@media print {
  body { background: white; margin: 0; padding: 0; }
  .screen-only { padding: 0; }
  .page-header, .toolbar, .add-row-btn, .bc-edit-bar,
  #qr-upload-hint, .bc-rate-row .rate-edit-hint,
  .rate-recalc-badge { display: none !important; }

  .bills-grid { display: none !important; }

  /* ─── Shared bill-card print styling (comfortable spacing) ─── */
  .print-slot .bill-card {
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: none;
    border: 1px solid #B8D8EE;
    border-radius: 4px;
    font-size: 7pt;
    box-sizing: border-box;
  }
  .bc-header { padding: 5px 9px; flex-shrink: 0; }
  .bc-brand-name { font-size: 11pt !important; }
  .bc-brand-sub { font-size: 7pt !important; }
  .bc-meta-month { font-size: 5.5pt !important; }
  .bc-meta-no { font-size: 6pt !important; }
  .bc-customer { padding: 5px 9px 4px; flex-shrink: 0; }
  .bc-to { font-size: 5pt !important; }
  .bc-name { font-size: 9pt !important; }
  .badge { font-size: 5pt !important; padding: 1px 5px !important; }
  .bc-rate-row { padding: 3px 9px !important; font-size: 6.5pt !important; flex-shrink: 0; }
  .rate-input { font-size: 7pt !important; width: 56px !important; padding: 2px 4px !important; text-align: center !important; }
  .bc-table { font-size: 6.5pt !important; }
  .bc-table th { padding: 2px 6px !important; font-size: 5.5pt !important; }
  .bc-table td { padding: 1.5px 6px !important; white-space: nowrap; }
  .bc-table-wrap {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .bc-table { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .bc-table thead { display: block; flex: 0 0 auto; }
  .bc-table thead tr { display: table; width: 100%; table-layout: fixed; }
  .bc-table tbody { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .bc-table tbody tr { display: table; width: 100%; table-layout: fixed; flex: 1 1 0; min-height: 0; }
  .bc-table td { vertical-align: middle; }
  .bc-footer { padding: 6px 9px 7px; flex-shrink: 0; }
  .bc-summary-row { font-size: 6.5pt !important; padding: 1.5px 0 !important; }
  .bc-total-row { font-size: 8pt !important; margin-top: 4px !important; padding-top: 4px !important; }
  .bc-total-amt { font-size: 10pt !important; }
  .bc-pay-note { font-size: 5.5pt !important; margin-top: 4px !important; padding-top: 4px !important; }
  .bc-qr { padding: 5px 9px 0 !important; margin-top: 4px !important; gap: 8px !important; }
  .bc-qr-img { width: 80px !important; height: 80px !important; flex-shrink: 0; }
  .bc-qr-text p { font-size: 5.5pt !important; }
  .bc-qr-text strong { font-size: 6pt !important; }

  /* ─── 3-up portrait (default) ─── */
  .print-page {
    display: flex;
    flex-direction: row;
    width: 210mm;
    height: 297mm;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
    box-sizing: border-box;
  }
  .print-page:last-child { page-break-after: avoid; break-after: avoid; }
  .print-slot {
    flex: 1;
    height: 297mm;
    box-sizing: border-box;
    padding: 4mm 3mm;
    position: relative;
  }
  .print-slot:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0; top: 4mm; bottom: 4mm;
    width: 0;
    border-right: 1.2px dashed #9BBBD8;
  }
  .print-page .print-slot .bill-card {
    height: calc(297mm - 8mm);
    max-height: calc(297mm - 8mm);
  }

}

/* ── Rate row ── */
.bc-rate-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 14px 4px;
  border-bottom: 1px dashed var(--brand-rule);
  background: var(--brand-warm);
}
.bc-rate-row label {
  font-size: .62rem; text-transform: uppercase;
  letter-spacing: .08em; color: var(--brand-muted);
  font-weight: 700; flex-shrink: 0;
}
.rate-input {
  width: 58px; padding: 3px 6px;
  border: 1.5px solid var(--brand-rule);
  border-radius: 5px; font-family: 'DM Mono', monospace;
  font-size: .8rem; font-weight: 600; color: var(--brand-dark);
  background: white; outline: none; text-align: center;
}
.rate-input:focus { border-color: var(--brand-accent); box-shadow: 0 0 0 2px rgba(62,143,204,.15); }
.rate-recalc-badge {
  font-size: .58rem; color: var(--brand-muted);
  font-style: italic; flex: 1; text-align: right;
}

</style>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
const BILL_CTX = ZZ_BILLCTX_ZZ;
const BILLS_DATA = (BILL_CTX && BILL_CTX.bills) ? BILL_CTX.bills : [];
// ── STATE ─────────────────────────────────────────────────────────────────
let qrDataUrl = null;
let state = JSON.parse(JSON.stringify(BILLS_DATA)); // deep clone for editing

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAll() {
  const grid = document.getElementById('billsGrid');
  grid.innerHTML = '';
  state.forEach((b, idx) => grid.appendChild(buildCard(b, idx)));
  try {
    const _pl=document.getElementById('phLogo'); if(_pl && BILL_CTX && BILL_CTX.logo) _pl.src=BILL_CTX.logo;
    if (BILL_CTX && BILL_CTX.monthLabel) {
      document.title = BILL_CTX.monthLabel + ' Bills';
      const p = document.querySelector('.ph-title p');
      if (p) p.textContent = 'Customer bills \u00b7 ' + BILL_CTX.monthLabel;
      const statsEl = document.querySelector('.ph-stats');
      if (statsEl) {
        const nBills = state.length;
        const litres = state.reduce((a,b)=>a+(b.total_qty||0),0);
        const amt    = state.reduce((a,b)=>a+(b.amount||0),0);
        statsEl.innerHTML =
          '<div class="ph-stat"><strong>'+nBills+'</strong><span>Bills</span></div>'+
          '<div class="ph-stat"><strong>'+litres.toFixed(0)+' L</strong><span>Total litres</span></div>'+
          '<div class="ph-stat"><strong>\u20b9'+amt.toFixed(0)+'</strong><span>Total billed</span></div>';
      }
    }
  } catch(e) {}
}

function buildCard(b, idx) {
  const div = document.createElement('div');
  div.className = 'bill-card';
  div.dataset.idx = idx;
  div.dataset.type = b.milk_type.toLowerCase();

  const badge = b.milk_type
    ? `<span class="badge ${b.milk_type==='Buffalo'?'b-badge':'c-badge'}">${b.milk_type}</span>`
    : '';

  // Build delivered-dates lookup
  const deliveredMap = {};
  b.entries.forEach(e => { deliveredMap[e.date] = e; });

  // Days of the selected billing month (from context)
  const MAY_DAYS = (BILL_CTX && BILL_CTX.days) ? BILL_CTX.days : [];
  // Start from the day of first delivery (don't show days before customer started)
  const firstIdx = MAY_DAYS.findIndex(d => deliveredMap[d.date]);
  const startIdx = firstIdx >= 0 ? firstIdx : 0;

  const rows = MAY_DAYS.slice(startIdx).map((d, ri) => {
    const e = deliveredMap[d.date];
    const delivered = !!e;
    const paid = delivered && e.paid;
    const qty  = delivered ? e.qty.toFixed(2) + ' L' : '';
    const amt  = !delivered ? ''
      : (paid ? `<span style="color:#1F8A4C;font-weight:700">PAID</span>` : (e.qty * b.rate).toFixed(2));
    const chk  = delivered
      ? `<span style="color:#27ae60;font-weight:bold">✓</span>`
      : `<span style="color:#cc3333;opacity:.7">✕</span>`;
    const rowStyle = !delivered ? ' style="background:#FFF4F4;"'
      : (paid ? ' style="background:#EAF7EA;"' : '');
    return `<tr data-ri="${ri}"${rowStyle}>
      <td contenteditable="false" class="cell-date">${d.date}</td>
      <td contenteditable="false" class="cell-chk" style="text-align:center">${chk}</td>
      <td contenteditable="false" class="cell-qty">${qty}</td>
      <td contenteditable="false" class="cell-line">${amt}</td>
    </tr>`;
  }).join('');

  const qrHTML = qrDataUrl
    ? `<img src="${qrDataUrl}" alt="QR">`
    : `<span>UPI QR<br>Upload above</span>`;

  div.innerHTML = `
    <div class="bc-header">
      <div class="bc-brand">
        <img src="${BILL_CTX.logo||''}" style="width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 50%;background:white;border:1px solid #3E8FCC">
        <div>
          <div class="bc-brand-name">Banki Dairy Farm</div>
          <div class="bc-brand-sub">Rooted in Purity</div>
        </div>
      </div>
      <div class="bc-meta">
        <div class="bc-meta-month">${BILL_CTX.monthLabel}</div>
        <div class="bc-meta-no">#${String(idx+1).padStart(3,'0')}</div>
      </div>
    </div>

    <div class="bc-customer">
      <div>
        <span class="bc-to">Bill To</span>
        <span class="bc-name" data-field="name">${b.display_name}</span>
      </div>
      ${badge}
    </div>

    <div class="bc-rate-row">
      <label>Rate ₹/L</label>
      <input class="rate-input" type="number" value="${b.rate}" min="0" step="0.5"
        onchange="changeRate(${idx}, this.value)"
        onclick="event.stopPropagation()"
        ondblclick="event.stopPropagation()">
      <span class="rate-recalc-badge">auto-recalculates all rows</span>
    </div>
    <div class="bc-table-wrap"><table class="bc-table">
      <thead><tr><th>Date</th><th style="text-align:center">✓/✗</th><th style="text-align:right">Qty</th><th style="text-align:right">Amt (₹)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="add-row-btn" onclick="addRow(${idx})">+ Add Row</button></div>

    <div class="bc-footer">
      <div class="bc-summary-row"><span>Total Litres</span><span>${b.total_qty.toFixed(2)} L</span></div>
      <div class="bc-summary-row"><span>Rate</span><span>₹${b.rate.toFixed(0)}/L</span></div>
      <div class="bc-total-row">
        <span>TOTAL DUE</span>
        <span class="bc-total-amt" data-field="amount">₹${b.amount.toFixed(2)}</span>
      </div>
      <div class="bc-qr">
        <div class="bc-qr-img">${qrHTML}</div>
        <div class="bc-qr-text">
          <strong>Scan to Pay</strong>
          <p>Banki Dairy Farm<br>UPI · Cash accepted</p>
        </div>
      </div>
      <div class="bc-pay-note">Due by ${BILL_CTX.dueLabel} &nbsp;·&nbsp; Thank you!</div>
    </div>
    <div class="bc-edit-bar">
      <button class="bc-edit-bar button btn-cancel" onclick="cancelEdit(${idx})">Cancel</button>
      <button class="bc-edit-bar button btn-save" onclick="saveEdit(${idx})">✓ Save</button>
    </div>`;

  // Double-click to enter edit mode
  div.addEventListener('dblclick', () => enterEdit(div, idx));
  return div;
}

function enterEdit(card, idx) {
  card.classList.add('editing');
  // Make name editable
  card.querySelector('.bc-name').contentEditable = 'true';
  card.querySelector('.bc-name').focus();
  // Make all table cells editable
  card.querySelectorAll('td').forEach(td => td.contentEditable = 'true');
}

function saveEdit(idx) {
  const card = document.querySelector(`.bill-card[data-idx="${idx}"]`);
  // Save name
  state[idx].display_name = card.querySelector('.bc-name').textContent.trim();
  // Save rows
  const rows = card.querySelectorAll('tbody tr');
  const newEntries = [];
  rows.forEach(tr => {
    const cells = tr.querySelectorAll('td');
    const dateText = cells[0].textContent.replace(/,.*$/, '').trim();
    const amtText = cells[3] ? cells[3].textContent : '';
    const isPaid = /paid/i.test(amtText);
    const qtyText = parseFloat(cells[2] ? cells[2].textContent : cells[1].textContent) || 0;
    if (qtyText > 0 || isPaid) newEntries.push({ date: dateText, day: '', qty: qtyText, paid: isPaid });
  });
  state[idx].entries = newEntries;
  // Recalculate total (paid days excluded)
  const total = newEntries.reduce((s,e) => s + (e.paid ? 0 : e.qty), 0);
  state[idx].total_qty = Math.round(total * 100) / 100;
  state[idx].amount = Math.round(total * state[idx].rate * 100) / 100;

  // Re-render just this card
  const grid = document.getElementById('billsGrid');
  const oldCard = document.querySelector(`.bill-card[data-idx="${idx}"]`);
  grid.replaceChild(buildCard(state[idx], idx), oldCard);
}

function cancelEdit(idx) {
  const card = document.querySelector(`.bill-card[data-idx="${idx}"]`);
  const grid = document.getElementById('billsGrid');
  grid.replaceChild(buildCard(state[idx], idx), card);
}

function addRow(idx) {
  state[idx].entries.push({ date: 'New Date', day: '', qty: 0 });
  const card = document.querySelector(`.bill-card[data-idx="${idx}"]`);
  const grid = document.getElementById('billsGrid');
  const newCard = buildCard(state[idx], idx);
  grid.replaceChild(newCard, card);
  enterEdit(newCard, idx);
}

// ── FILTER & SEARCH ───────────────────────────────────────────────────────
function filterBills(type) {
  document.querySelectorAll('.bill-card').forEach(c => {
    if (type === 'all') { c.style.display = ''; return; }
    c.style.display = c.dataset.type === type ? '' : 'none';
  });
}
function searchBills(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.bill-card').forEach(c => {
    const name = c.querySelector('.bc-name').textContent.toLowerCase();
    c.style.display = name.includes(q) ? '' : 'none';
  });
}

// ── QR UPLOAD ─────────────────────────────────────────────────────────────
function uploadQR(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    qrDataUrl = e.target.result;
    // Update all QR placeholders
    document.querySelectorAll('.bc-qr-img').forEach(div => {
      div.innerHTML = `<img src="${qrDataUrl}" alt="QR">`;
    });
    document.getElementById('qr-upload-hint').textContent = '✅ QR uploaded — visible on all bills';
  };
  reader.readAsDataURL(file);
}

// ── RATE CHANGE ──────────────────────────────────────────────────────────
function changeRate(idx, newRate) {
  const rate = parseFloat(newRate);
  if (isNaN(rate) || rate < 0) return;
  state[idx].rate = rate;
  let total = 0;
  state[idx].entries.forEach(e => { if (!e.paid) total += e.qty; });
  state[idx].total_qty = Math.round(total * 100) / 100;
  state[idx].amount = Math.round(total * rate * 100) / 100;
  const card = document.querySelector(`.bill-card[data-idx="${idx}"]`);
  if (card) {
    const grid = document.getElementById('billsGrid');
    grid.replaceChild(buildCard(state[idx], idx), card);
  }
}

// ── PRINT PAGE BUILDER ───────────────────────────────────────────────────
function buildPrintPages() {
  document.querySelectorAll('.print-page').forEach(p => p.remove());

  const cards = Array.from(document.querySelectorAll('#billsGrid .bill-card'))
    .filter(c => c.style.display !== 'none');

  const container = document.body;
  for (let i = 0; i < cards.length; i += 3) {
    const page = document.createElement('div');
    page.className = 'print-page';
    for (let j = i; j < i + 3 && j < cards.length; j++) {
      const slot = document.createElement('div');
      slot.className = 'print-slot';
      slot.appendChild(cards[j].cloneNode(true));
      page.appendChild(slot);
    }
    container.appendChild(page);
  }
}

function destroyPrintPages() {
  document.querySelectorAll('.print-page').forEach(p => p.remove());
}

window.addEventListener('beforeprint', buildPrintPages);
window.addEventListener('afterprint', destroyPrintPages);

// ── INIT ──────────────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
